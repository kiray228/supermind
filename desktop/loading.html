<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SuperMind</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; background: #f6f6f8; color: #1c1c1e; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f2f2f7; } p { color: #98989f; } }
  main { text-align: center; max-width: 380px; padding: 24px; }
  img { width: 72px; height: 72px; border-radius: 18px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.92); opacity: .75; } }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { margin: 0 0 20px; color: #6e6e73; }
  #slow { display: none; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 10px 22px; background: #007aff; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="build/icon.png" alt="">
  <h1>Загружаем SuperMind…</h1>
  <div id="slow">
    <p>Интернет медленный — первый запуск может занять до минуты. Дальше SuperMind открывается сразу, даже без сети.</p>
    <button id="retry">Повторить</button>
  </div>
</main>
<script>
  const url = new URLSearchParams(location.search).get('url');
  setTimeout(() => { document.getElementById('slow').style.display = 'block'; }, 15000);
  document.getElementById('retry').onclick = () => { location.href = url; };
</script>
</body>
</html>

[package]
name = "supermind"
version = "1.25.0"
description = "SuperMind для Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-opener = "2.7"

# маленький exe: программа — только окно с сайтом
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>SuperMind — интеллект-карты</title>
    <meta name="description" content="Бесплатные интеллект-карты с ИИ, доска задач и ежедневник. Работает офлайн." />
    <meta name="theme-color" content="#f2f2f7" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SuperMind" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      /* заставка до загрузки приложения (React заменит её) */
      html, body { margin: 0; background: #f6f7f9; }
      @media (prefers-color-scheme: dark) { html, body { background: #0f1115; } }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font: 600 15px/1.2 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #8a8f99; }
      .boot img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 12px 36px rgba(16, 185, 129, 0.3); animation: boot 1.6s ease-in-out infinite; }
      @keyframes boot { 50% { transform: scale(0.94); opacity: 0.8; } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="./icon-192.png" alt="" /><span>SuperMind</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

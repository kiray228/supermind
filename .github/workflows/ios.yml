name: Build iOS app

# iOS собирается только в Xcode на Mac, поэтому сборка идёт на облачном Mac GitHub (для открытого репозитория — бесплатно).
# Без секретов Apple — проверочная сборка для симулятора: компилируется ли iOS-проект.
# С секретами (см. store/README.md → «App Store») и галочкой upload — архив, подпись облачными сертификатами Xcode
# и выгрузка сборки в App Store Connect (TestFlight), откуда её отправляют на проверку.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Выгрузить в TestFlight (нужны секреты APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8)'
        type: boolean
        default: false
  push:
    branches: [main, store-release]
    paths: ['ios/**', 'src/**', 'package.json', 'capacitor.config.ts', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # App Store принимает только сборки свежим Xcode (iOS SDK последней версии)
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      # свои Swift-файлы, права (App Group, HealthKit) и расширение виджетов — в проект Xcode
      - name: Цели проекта (виджеты, права)
        run: |
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby ios/scripts/setup-targets.rb

      - name: Проверочная сборка (симулятор, без подписи)
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0

      - name: Архив и выгрузка в App Store Connect
        if: ${{ inputs.upload }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -o pipefail
          for v in TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Не задан секрет для $v (Settings → Secrets → Actions)"; exit 1; fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          VERSION=$(node -p "require('./package.json').version")
          # номер сборки растёт с каждым запуском — App Store Connect не принимает повторный
          BUILD=$((1000 + GITHUB_RUN_NUMBER))

          # Архив без подписи: автоподпись при архивации требует профиль разработчика,
          # а его нельзя создать без зарегистрированного iPhone. Подписывает экспорт ниже —
          # облачным сертификатом Apple Distribution и профилем App Store.
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" | tail -n 80

          # Права (App Group, HealthKit) попадают в подпись только при подписи. Архив без подписи —
          # поэтому подписываем его «на месте» (ad-hoc) с файлами прав: экспорт ниже переподпишет
          # облачным сертификатом и возьмёт права из этой подписи.
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          for f in "$APP"/Frameworks/* "$APP"/PlugIns/*/Frameworks/*; do
            [ -e "$f" ] && codesign --force --sign - "$f"
          done
          for x in "$APP"/PlugIns/*.appex; do
            [ -e "$x" ] && codesign --force --sign - --entitlements ios/App/SuperMindWidget/SuperMindWidget.entitlements "$x"  # у «Поделиться» те же права (App Group)
          done
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$APP"

          # сначала экспорт в файл — проверить права в подписанной сборке, затем такой же экспорт с выгрузкой
          for DEST in export upload; do
          cat > "$RUNNER_TEMP/ExportOptions-$DEST.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          done

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            "${AUTH[@]}" | tail -n 40
          ( cd "$RUNNER_TEMP/ipa" && unzip -q -o ./*.ipa )
          echo "--- права приложения"
          codesign -d --entitlements - "$RUNNER_TEMP/ipa/Payload/App.app" 2>/dev/null | tee "$RUNNER_TEMP/ent-app.txt"
          echo "--- права виджета"
          codesign -d --entitlements - "$RUNNER_TEMP/ipa/Payload/App.app/PlugIns/SuperMindWidget.appex" 2>/dev/null | tee "$RUNNER_TEMP/ent-widget.txt"
          grep -q group.app.twomind.mindmap "$RUNNER_TEMP/ent-app.txt" || { echo "::error::В подписи приложения нет App Group"; exit 1; }
          grep -q com.apple.developer.healthkit "$RUNNER_TEMP/ent-app.txt" || { echo "::error::В подписи приложения нет HealthKit"; exit 1; }
          grep -q group.app.twomind.mindmap "$RUNNER_TEMP/ent-widget.txt" || { echo "::error::В подписи виджета нет App Group"; exit 1; }
          codesign -d --entitlements - "$RUNNER_TEMP/ipa/Payload/App.app/PlugIns/ShareExtension.appex" 2>/dev/null | tee "$RUNNER_TEMP/ent-share.txt"
          grep -q group.app.twomind.mindmap "$RUNNER_TEMP/ent-share.txt" || { echo "::error::В подписи «Поделиться» нет App Group"; exit 1; }

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 40
          rm -f "$KEY_PATH"
          echo "Сборка $VERSION ($BUILD) выгружена в App Store Connect → TestFlight"

name: Build iOS app

# iOS собирается только в Xcode на Mac, поэтому сборка идёт на облачном Mac GitHub (для открытого репозитория — бесплатно).
# Без секретов Apple — проверочная сборка для симулятора: компилируется ли iOS-проект.
# С секретами (см. store/README.md → «App Store») и галочкой upload — архив, подпись облачными сертификатами Xcode
# и выгрузка сборки в App Store Connect (TestFlight), откуда её отправляют на проверку.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Выгрузить в TestFlight (нужны секреты APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8)'
        type: boolean
        default: false
  push:
    branches: [main, store-release]
    paths: ['ios/**', 'src/**', 'package.json', 'capacitor.config.ts', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # App Store принимает только сборки свежим Xcode (iOS SDK последней версии)
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Проверочная сборка (симулятор, без подписи)
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0

      - name: Архив и выгрузка в App Store Connect
        if: ${{ inputs.upload }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -o pipefail
          for v in TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Не задан секрет для $v (Settings → Secrets → Actions)"; exit 1; fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          VERSION=$(node -p "require('./package.json').version")
          # номер сборки растёт с каждым запуском — App Store Connect не принимает повторный
          BUILD=$((1000 + GITHUB_RUN_NUMBER))

          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            "${AUTH[@]}" | tail -n 80

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 40
          rm -f "$KEY_PATH"
          echo "Сборка $VERSION ($BUILD) выгружена в App Store Connect → TestFlight"
